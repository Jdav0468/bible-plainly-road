<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bible, Plainly — The Road</title>
<!-- v20 fluid play, music off -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<style>body{margin:0;background:#12100e;color:#e7dccb;font-family:Georgia,serif}p{padding:28px 22px;font-size:18px}</style>
</head>
<body>
<p id="wait">Opening the page…</p>
<script>
(function(){
  var sources=[
    "https://cdn.jsdelivr.net/gh/Jdav0468/bible-plainly-road@208312696c8b4b4702fc9c000791aaf74927f83d/index.html",
    "https://raw.githubusercontent.com/Jdav0468/bible-plainly-road/208312696c8b4b4702fc9c000791aaf74927f83d/index.html"
  ];
  var look = '<style id="look">'
    + 'body{background:radial-gradient(800px 360px at 50% -8%, rgba(198,163,106,.18), transparent 62%), linear-gradient(180deg,#1c1814 0%, #12100e 46%, #0c0b0a 100%) !important;color:#f3eadc !important;}'
    + '.wrap{max-width:560px !important;padding-bottom:108px !important;}'
    + 'h1,.wrap h1,.panel h2,.book h2,.prompt,#invitePrompt{font-family:Palatino,Georgia,serif !important;color:#1c1814 !important;}'
    + 'h1{font-weight:500 !important;letter-spacing:-.03em !important;font-size:clamp(32px,6vw,44px) !important;}'
    + 'h1 em{color:#8a6430 !important;}'
    + '.lede{color:#3c342c !important;font-size:17px !important;}'
    + '#sound,#todayRow,#startPanel{display:none !important;}'
    + '#inviteCard{background:#f4efe4 !important;color:#1c1814 !important;border:1px solid rgba(154,120,58,.45) !important;border-radius:22px !important;padding:18px !important;margin:14px 0 !important;}'
    + '#invitePrompt{font-size:clamp(24px,4vw,32px) !important;line-height:1.25 !important;margin:8px 0 8px !important;}'
    + '#inviteWhy,#inviteCount{color:#4a4036 !important;margin:0 0 12px !important;}'
    + '#inviteChoices .choice{width:100%;text-align:left;margin:8px 0;min-height:54px;border-radius:16px;border:1px solid rgba(154,120,58,.45);background:#fffaf2;color:#1c1814;font:18px/1.3 Georgia,serif;padding:12px 14px;transition:transform .12s ease, background .2s ease;}'
    + '#inviteChoices .choice:active{transform:scale(.98);}'
    + '#inviteChoices .choice.right{background:#e5efe6;border-color:#2c5a42;}'
    + '#inviteChoices .choice.wrong{background:#f6e6e1;border-color:#8a4036;}'
    + '#inviteNext{width:100%;min-height:54px;margin-top:8px;border:0;border-radius:999px;background:#1c1814;color:#f4efe4;font-size:18px;}'
    + '#inviteNext.hidden{display:none;}'
    + '.choice{transition:transform .12s ease;}'
    + '.choice:active{transform:scale(.98);}'
    + '#next{min-height:52px;border-radius:999px;}'
    + '.scene{max-height:110px;overflow:hidden;}'
    + '.scene img{max-height:110px;object-fit:cover;width:100%;}'
    + '.walk,.panel,.book{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;border:1px solid rgba(154,120,58,.4) !important;}'
    + '.dock{background:rgba(14,12,11,.94) !important;border-top:1px solid rgba(198,163,106,.32) !important;}'
    + '.dock button.on{color:#f0dfb4 !important;box-shadow:inset 0 -2px 0 #c6a36a !important;}'
    + '</style>';
  var card = '<div class="panel" id="inviteCard"><p class="qbook">Today\u2019s question</p><h2 id="invitePrompt">One question is on the page.</h2><p class="hint" id="inviteWhy">Tap an answer.</p><div id="inviteChoices"></div><button class="go hidden" id="inviteNext" type="button">Next question</button><p class="hint" id="inviteCount"></p></div>';
  var hook = '<script>(function(){'
    + 'function killHymn(){var nodes=document.querySelectorAll("audio");for(var i=0;i<nodes.length;i++){nodes[i].pause();nodes[i].volume=0;nodes[i].removeAttribute("src");}}'
    + 'function startMusic(){killHymn();}function stopMusic(){killHymn();}window.startMusic=startMusic;window.stopMusic=stopMusic;killHymn();'
    + 'if(window.HTMLMediaElement){var orig=HTMLMediaElement.prototype.play;HTMLMediaElement.prototype.play=function(){var src=(this.currentSrc||this.src||"")+"";if(this.id==="hymn"||src.indexOf("hymn")!==-1){this.pause();this.volume=0;return Promise.resolve();}return orig.apply(this,arguments);};}'
    + 'function paint(){try{if(typeof questionForDay!=="function")return;var q=questionForDay(dayStamp());var p=document.getElementById("invitePrompt");if(p)p.textContent=q.prompt;var known=0;try{known=(load().known||[]).length;}catch(e){}var w=document.getElementById("inviteWhy");if(w)w.textContent=q.book+". Tap an answer. You can place "+known+" of 66.";var opts=q.choices.map(function(t,n){return {t:t,ok:n===0};});for(var n=opts.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1));var tmp=opts[n];opts[n]=opts[j];opts[j]=tmp;}var box=document.getElementById("inviteChoices");if(!box)return;box.innerHTML="";opts.forEach(function(o,i){var b=document.createElement("button");b.className="choice";b.type="button";b.textContent=(i+1)+". "+o.t;b.onclick=function(){mark(i,opts,q);};box.appendChild(b);});}catch(e){}}'
    + 'function mark(i,opts,q){var ok=opts[i].ok;var buttons=document.querySelectorAll("#inviteChoices button");buttons.forEach(function(b,n){b.disabled=true;if(opts[n].ok)b.classList.add("right");else if(n===i)b.classList.add("wrong");});var note=document.getElementById("inviteWhy");if(note)note.textContent=(ok?"Right. ":"Not that one. ")+q.ref+". "+q.plain;try{if(typeof qid==="function"&&typeof save!=="undefined"){var id=qid(q);if(save.used.indexOf(id)<0)save.used.push(id);save.notes[q.book]={ref:q.ref,plain:q.plain};if(!save.right)save.right=[];if(!save.missed)save.missed=[];if(ok){if(save.right.indexOf(id)<0)save.right.push(id);save.missed=save.missed.filter(function(x){return x!==id;});}else if(save.missed.indexOf(id)<0)save.missed.push(id);if(typeof persist==="function")persist();if(typeof tone==="function")tone(ok);}}catch(e){}var next=document.getElementById("inviteNext");if(next){next.classList.remove("hidden");next.onclick=function(){var mile=document.querySelector(".walk[data-id=\\"mile\\"]");if(mile)mile.click();};}}'
    + 'paint();'
    + '})();<\/script>';
  function openGame(html){
    html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");
    html=html.replace("const BANK","var BANK");
    html=html.replace("let save","var save");
    html=html.replace("Sixty-six books. It is worth studying because the truth is in the Bible. A church can help, and a preacher can explain, but you still need to open it yourself. A hint can point you to the part. The line is still yours to place.","Tap an answer. The page shows the line. Then take the next question.");
    html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');
    if(html.indexOf("</head>")!==-1) html=html.replace("</head>", look+"</head>");
    html=html.replace("</body>", hook+"</body>");
    document.open();document.write(html);document.close();
  }
  function fail(){var el=document.getElementById("wait");if(el)el.textContent="The page did not open. Refresh once.";}
  function tryAt(i){
    if(i>=sources.length){fail();return;}
    fetch(sources[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("bad");return r.text();}).then(function(html){
      if(html.indexOf("Sixty-six books")===-1) throw new Error("short");
      openGame(html);
    }).catch(function(){tryAt(i+1);});
  }
  tryAt(0);
})();
</script>
</body>
</html>
