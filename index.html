<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bible, Plainly — The Road</title>
<!-- v27 a score to beat, music off -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<style>body{margin:0;background:#12100e;color:#e7dccb;font-family:Georgia,serif}p{padding:28px 22px;font-size:18px}</style>
</head>
<body>
<p id="wait">Opening the page…</p>
<script>
(function(){
  var sources=[
    "https://cdn.jsdelivr.net/gh/Jdav0468/bible-plainly-road@208312696c8b4b4702fc9c000791aaf74927f83d/index.html",
    "https://raw.githubusercontent.com/Jdav0468/bible-plainly-road/208312696c8b4b4702fc9c000791aaf74927f83d/index.html"
  ];
  var look = '<style id="look">'
    + 'body{background:radial-gradient(800px 360px at 50% -8%, rgba(198,163,106,.22), transparent 62%), linear-gradient(180deg,#1c1814 0%, #12100e 46%, #0c0b0a 100%) !important;color:#f3eadc !important;}'
    + '.wrap{max-width:560px !important;padding-bottom:120px !important;}'
    + 'h1,.panel h2,#invitePrompt{font-family:Palatino,Georgia,serif !important;color:#1c1814 !important;}'
    + 'h1 em{color:#8a6430 !important;}'
    + '.lede,#startPanel,#todayRow,#sound,.sound{display:none !important;}'
    + '#inviteCard{background:#f4efe4 !important;color:#1c1814 !important;border:1px solid rgba(154,120,58,.45) !important;border-radius:22px !important;padding:18px !important;margin:8px 0 14px !important;}'
    + '#inviteCard.turn{animation:turn .32s ease;}'
    + '@keyframes turn{from{opacity:.4;transform:translateY(12px)}to{opacity:1;transform:none}}'
    + '#inviteHead{display:flex;justify-content:space-between;align-items:center;gap:12px;}'
    + '#inviteClock{min-width:64px;text-align:center;font:600 20px/1 Georgia,serif;color:#8a6430;border:1px solid rgba(138,100,48,.45);border-radius:999px;padding:8px 10px;background:#fffaf2;}'
    + '#inviteClock.low{color:#8a4036;border-color:#8a4036;animation:pulse .6s ease infinite;}'
    + '@keyframes pulse{50%{transform:scale(1.06)}}'
    + '#inviteScore{display:flex;justify-content:space-between;gap:8px;margin:6px 0 8px;font:600 13px/1.3 Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:#8a6430;}'
    + '#invitePrompt{font-size:28px;line-height:1.25;margin:8px 0;}'
    + '#inviteWhy,#invitePage{color:#4a4036 !important;}'
    + '#inviteMarks{display:flex;gap:8px;margin:8px 0 10px;}'
    + '#inviteMarks i{width:18px;height:18px;border-radius:50%;border:1.5px solid #8a6430;display:block;transform:scale(.7);opacity:.45;transition:transform .25s ease,background .25s ease;}'
    + '#inviteMarks i.on{background:#c6a36a;transform:scale(1);opacity:1;box-shadow:0 0 0 4px rgba(198,163,106,.28);}'
    + '#inviteChoices .choice{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0;min-height:54px;border-radius:16px;border:1px solid rgba(154,120,58,.45);background:#fffaf2;color:#1c1814;font:18px Georgia,serif;padding:12px 14px;}'
    + '#inviteChoices .choice.right{background:#e7f3e4;border-color:#2c5a42;animation:lift .35s ease;}'
    + '@keyframes lift{from{transform:scale(.98)}to{transform:none}}'
    + '#inviteChoices .choice.wrong{background:#f6e6e1;border-color:#8a4036;animation:shake .32s linear;}'
    + '@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}'
    + '#inviteNext,#inviteSend,#inviteQuit,#inviteSound{min-height:52px;margin-top:8px;border-radius:999px;font:17px Georgia,serif;}'
    + '#inviteNext,#inviteSend{width:100%;border:0;background:#1c1814;color:#f4efe4;}'
    + '#inviteQuit,#inviteSound{background:#fffaf2;color:#1c1814;border:1px solid rgba(138,100,48,.55);}'
    + '#inviteRow{display:flex;gap:8px;}'
    + '#inviteRow button{flex:1;}'
    + '.hidden{display:none !important;}'
    + '.key{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#1c1814;color:#f4efe4;font-size:13px;flex:none;}'
    + '.dock{position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;z-index:50 !important;display:flex !important;background:#f4efe4 !important;border-top:2px solid #c6a36a !important;padding:8px 8px calc(8px + env(safe-area-inset-bottom)) !important;}'
    + '.dock button{flex:1 !important;color:#1c1814 !important;background:transparent !important;font:600 15px/1.2 Georgia,serif !important;min-height:52px !important;border-radius:14px !important;border:0 !important;}'
    + '.dock button.on{background:#1c1814 !important;color:#f4efe4 !important;}'
    + '.walk,.panel,.book{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;}'
    + '</style>';
  var card = '<div class="panel" id="inviteCard"><div id="inviteHead"><p class="qbook" id="inviteLabel">Place five</p><div id="inviteClock">0:30</div></div><p id="inviteScore"><span id="inviteNow">0</span><span id="inviteBest">Best 0</span></p><div id="inviteMarks"></div><h2 id="invitePrompt">One question is on the page.</h2><p class="hint" id="inviteWhy">Tap an answer. Faster adds more.</p><div id="inviteChoices"></div><p class="hint" id="invitePage"></p><button class="hidden" id="inviteNext" type="button">Next line</button><button class="hidden" id="inviteSend" type="button">Send this walk</button><div id="inviteRow"><button id="inviteQuit" type="button">Main menu</button><button id="inviteSound" type="button">Sound on</button></div></div>';
  var hook = '<script>(function(){'
    + 'function killHymn(){var nodes=document.querySelectorAll("audio");for(var i=0;i<nodes.length;i++){nodes[i].pause();nodes[i].volume=0;nodes[i].removeAttribute("src");}}'
    + 'window.startMusic=function(){killHymn();};window.stopMusic=window.startMusic;killHymn();'
    + 'var queue=[], qi=0, locked=false, streak=0, placed=0, score=0, best=0, opts=[], left=30, clock=0, ac=null, soundOn=true, timer=0;'
    + 'try{best=Number(localStorage.getItem("biblePlainlyWalkScore")||0)||0;}catch(e){}'
    + 'function audio(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==="suspended")ac.resume();return ac;}'
    + 'function chime(notes,gain){if(!soundOn)return;var ctx=audio();if(!ctx)return;var t=ctx.currentTime;notes.forEach(function(n,i){var o=ctx.createOscillator();var g=ctx.createGain();o.type="sine";o.frequency.value=n;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22+i*0.08);o.connect(g);g.connect(ctx.destination);o.start(t+i*0.07);o.stop(t+0.34+i*0.08);});}'
    + 'function shuffle(a){for(var n=a.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1));var t=a[n];a[n]=a[j];a[j]=t;}return a;}'
    + 'function build(){if(typeof questionForDay!=="function"||typeof BANK==="undefined")return;var today=questionForDay(dayStamp());var seen={};seen[today.book+"|"+today.prompt]=1;queue=[today];var bag=shuffle(BANK.slice());for(var i=0;i<bag.length&&queue.length<8;i++){var q=bag[i];var id=q.book+"|"+q.prompt;if(!seen[id]){seen[id]=1;queue.push(q);}}}'
    + 'function showClock(){var c=document.getElementById("inviteClock");if(!c)return;c.textContent="0:"+(left<10?"0"+left:left);c.classList.toggle("low", left<=5);}'
    + 'function showScore(){var n=document.getElementById("inviteNow");if(n)n.textContent=score+" \u00b7 "+placed+" placed";var b=document.getElementById("inviteBest");if(b)b.textContent="Best "+best;}'
    + 'function stopClock(){clearInterval(clock);clock=0;clearTimeout(timer);}'
    + 'function startClock(){stopClock();left=30;showClock();clock=setInterval(function(){left--;showClock();if(left>0&&left<=5)chime([660],0.03);if(left<=0)timeUp();},1000);}'
    + 'function marks(){var m=document.getElementById("inviteMarks");if(!m)return;var h="";for(var i=0;i<5;i++)h+="<i"+(i<placed?" class=\\"on\\"":"")+"><\\/i>";m.innerHTML=h;}'
    + 'function remember(q,ok){try{if(typeof qid!=="function"||typeof save==="undefined")return;var id=qid(q);if(save.used.indexOf(id)<0)save.used.push(id);if(!save.right)save.right=[];if(!save.missed)save.missed=[];if(ok){if(save.right.indexOf(id)<0)save.right.push(id);}else if(save.missed.indexOf(id)<0)save.missed.push(id);if(typeof persist==="function")persist();}catch(e){}}'
    + 'function keepBest(){if(score>best){best=score;try{localStorage.setItem("biblePlainlyWalkScore",String(best));}catch(e){}}showScore();}'
    + 'function shareText(){return "I scored "+score+" on today\'s Bible walk. "+placed+" of "+queue.length+" placed. Best "+best+". Can you beat it? "+location.href;}'
    + 'function finish(){stopClock();keepBest();var p=document.getElementById("invitePrompt");if(p)p.textContent=score+" on this walk.";var w=document.getElementById("inviteWhy");if(w)w.textContent=placed+" of "+queue.length+" placed. "+(score>0&&score===best?"New best.":"Best "+best+".");var box=document.getElementById("inviteChoices");if(box)box.innerHTML="";var page=document.getElementById("invitePage");if(page)page.textContent="Send it. A friend can try the same first line.";var next=document.getElementById("inviteNext");if(next){next.classList.remove("hidden");next.textContent="Walk it again";next.onclick=function(){qi=0;placed=0;streak=0;score=0;build();paint();};}var send=document.getElementById("inviteSend");if(send){send.classList.remove("hidden");send.onclick=function(){var text=shareText();if(navigator.share){navigator.share({title:"How well do you know the Bible?",text:text}).catch(function(){});}else if(page)page.textContent=text;};}}'
    + 'function paint(){var q=queue[qi];if(!q)return;locked=false;var card=document.getElementById("inviteCard");if(card){card.classList.remove("turn");void card.offsetWidth;card.classList.add("turn");}var label=document.getElementById("inviteLabel");if(label)label.textContent=placed>=5?"Five placed":"Place five";marks();showScore();var p=document.getElementById("invitePrompt");if(p)p.textContent=q.prompt;var w=document.getElementById("inviteWhy");if(w)w.textContent=q.book+" \u00b7 "+(qi+1)+" of "+queue.length+". Faster adds more.";opts=shuffle(q.choices.map(function(t,n){return {t:t,ok:n===0};}));var box=document.getElementById("inviteChoices");if(!box)return;box.innerHTML="";opts.forEach(function(o,i){var b=document.createElement("button");b.className="choice";b.type="button";var k=document.createElement("span");k.className="key";k.textContent=String(i+1);var s=document.createElement("span");s.textContent=o.t;b.appendChild(k);b.appendChild(s);b.onclick=function(){mark(i);};box.appendChild(b);});var page=document.getElementById("invitePage");if(page)page.textContent="";var next=document.getElementById("inviteNext");if(next)next.classList.add("hidden");var send=document.getElementById("inviteSend");if(send)send.classList.add("hidden");startClock();}'
    + 'function after(ok){var next=document.getElementById("inviteNext");if(qi>=queue.length-1){if(next){next.classList.remove("hidden");next.textContent="See the walk";next.onclick=finish;}}else if(ok){timer=setTimeout(function(){qi++;paint();},900);}else if(next){next.classList.remove("hidden");next.textContent="Next line";next.onclick=function(){qi++;paint();};}}'
    + 'function mark(i){if(locked)return;locked=true;stopClock();audio();var q=queue[qi];var ok=opts[i].ok;if(ok){streak++;placed++;score+=100+left;chime([392,494,587],0.07);if(placed===5)chime([392,494,587,784],0.08);}else{streak=0;chime([196],0.05);}keepBest();marks();remember(q,ok);var buttons=document.querySelectorAll("#inviteChoices button");buttons.forEach(function(b,n){b.disabled=true;if(opts[n].ok)b.classList.add("right");else if(n===i)b.classList.add("wrong");});var page=document.getElementById("invitePage");if(page)page.textContent=(ok?"Placed. +"+(100+left)+". ":"Not that one. ")+q.ref+". "+q.plain;after(ok);}'
    + 'function timeUp(){if(locked)return;locked=true;stopClock();chime([196],0.05);var q=queue[qi];streak=0;remember(q,false);var buttons=document.querySelectorAll("#inviteChoices button");buttons.forEach(function(b,n){b.disabled=true;if(opts[n]&&opts[n].ok)b.classList.add("right");});var page=document.getElementById("invitePage");if(page)page.textContent="Time. "+q.ref+". "+q.plain;after(false);}'
    + 'build();paint();'
    + 'var quit=document.getElementById("inviteQuit");if(quit)quit.onclick=function(){stopClock();qi=0;placed=0;streak=0;score=0;build();paint();window.scrollTo(0,0);};'
    + 'var snd=document.getElementById("inviteSound");if(snd)snd.onclick=function(){soundOn=!soundOn;snd.textContent=soundOn?"Sound on":"Sound off";if(soundOn){audio();chime([392,494,587],0.07);}};'
    + '})();<\/script>';
  function openGame(html){
    html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");
    html=html.replace(/<audio\b[^>]*\/?>/gi,"");
    html=html.replace("const BANK","var BANK");
    html=html.replace("let save","var save");
    html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');
    if(html.indexOf("</head>")!==-1) html=html.replace("</head>", look+"</head>");
    html=html.replace("</body>", hook+"</body>");
    document.open();document.write(html);document.close();
  }
  function fail(){var el=document.getElementById("wait");if(el)el.textContent="The page did not open. Refresh once.";}
  function tryAt(i){
    if(i>=sources.length){fail();return;}
    fetch(sources[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("bad");return r.text();}).then(function(html){
      if(html.indexOf("Sixty-six books")===-1 && html.indexOf("heard the stories")===-1) throw new Error("short");
      openGame(html);
    }).catch(function(){tryAt(i+1);});
  }
  tryAt(0);
})();
</script>
</body>
</html>
