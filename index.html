<body>

<script>
(function(){

    + '</style>';
  var card = '<div class="panel" id="inviteCard"><div id="inviteHead"><p class="qbook" id="inviteLabel">Paul\u2019s letters</p><div id="inviteClock">0:30</div></div><p id="inviteScore"><span id="inviteNow">Score 0</span><span id="inviteBest">Set the mark</span></p><p id="inviteRace">Run the race. Paul, Philippians 3:14.</p><div id="inviteBarWrap"><div id="inviteBar"></div></div><div id="inviteMarks"></div><h2 id="invitePrompt">One question is on the page.</h2><p class="hint" id="inviteWhy">Eight lines from Paul. Same eight today.</p><div id="inviteChoices"></div><p class="hint" id="invitePage"></p><a id="inviteOpen" class="hidden" target="_blank" rel="noopener">Open the page</a><button class="hidden" id="inviteNext" type="button">Next line</button><button class="hidden" id="inviteMissed" type="button">Try the missed</button><button class="hidden" id="inviteSend" type="button">Send this</button><div id="inviteRow"><button id="inviteQuit" type="button">Main menu</button><button id="inviteSound" type="button">Sound on</button></div></div>';
  var hook = '<script>(function(){'
    + 'function killHymn(){var nodes=document.querySelectorAll("audio");for(var i=0;i<nodes.length;i++){nodes[i].pause();nodes[i].volume=0;nodes[i].removeAttribute("src");}}'

    + 'var queue=[], qi=0, locked=false, streak=0, placed=0, score=0, opts=[], missed=[], left=30, clock=0, ac=null, soundOn=true, best=0, wait=0;'
    + 'try{best=Number(localStorage.getItem("biblePlainlyScore")||0)||0;}catch(e){}'
    + 'function audio(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==="suspended")ac.resume();return ac;}'
    + 'function chime(notes,gain){if(!soundOn)return;var ctx=audio();if(!ctx)return;var t=ctx.currentTime;notes.forEach(function(n,i){var o=ctx.createOscillator();var g=ctx.createGain();o.type="sine";o.frequency.value=n;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22+i*0.08);o.connect(g);g.connect(ctx.destination);o.start(t+i*0.07);o.stop(t+0.34+i*0.08);});}'
    + 'function rand(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}'
    + 'function build(){if(typeof questionForDay!=="function"||typeof BANK==="undefined")return;var stamp=dayStamp();var r=rand(Number(String(stamp).replace(/-/g,""))||1);var seen={};queue=[];var paul={"Romans":1,"1 Corinthians":1,"2 Corinthians":1,"Galatians":1,"Ephesians":1,"Philippians":1,"Colossians":1,"1 Thessalonians":1,"2 Thessalonians":1,"1 Timothy":1,"2 Timothy":1,"Titus":1,"Philemon":1};var bag=BANK.filter(function(q){return paul[q.book];});if(bag.length<8)bag=BANK.slice();for(var n=bag.length-1;n>0;n--){var j=Math.floor(r()*(n+1));var tmp=bag[n];bag[n]=bag[j];bag[j]=tmp;}for(var i=0;i<bag.length&&queue.length<8;i++){var q=bag[i];var id=q.book+"|"+q.prompt;if(!seen[id]){seen[id]=1;queue.push(q);}}}'
    + 'function showClock(){var c=document.getElementById("inviteClock");if(!c)return;c.textContent="0:"+(left<10?"0"+left:left);c.classList.toggle("low", left<=5);}'
    + 'function stopClock(){clearInterval(clock);clock=0;clearTimeout(wait);}'
    + 'function startClock(){stopClock();left=30;showClock();clock=setInterval(function(){left--;showClock();if(left>0&&left<=5)chime([660],0.03);if(left<=0)timeUp();},1000);}'
    + 'function marks(){var m=document.getElementById("inviteMarks");if(!m)return;var h="";for(var i=0;i<8;i++)h+="<i"+(i<placed?" class=\\"on\\"":(i===placed?" class=\\"now\\"":""))+"><\\/i>";m.innerHTML=h;var now=document.getElementById("inviteNow");if(now)now.textContent="Score "+score+(streak>=2?" \u00b7 "+streak+" in a row":"");var b=document.getElementById("inviteBest");var gap=best-score;if(b)b.textContent=best<=0?"Set the mark":(score>best?"New best":(gap===0?"Even":gap+" behind"));var race=document.getElementById("inviteRace");if(race)race.textContent=score>best&&best>0?"New best. Press on. Philippians 3:14.":"Run the race. Paul, Philippians 3:14.";var bar=document.getElementById("inviteBar");if(bar){var goal=Math.max(best,1);bar.style.width=Math.min(100,Math.round(score/goal*100))+"%";}}'
    + 'function pageLink(q){var a=document.getElementById("inviteOpen");if(!a)return;a.href="https://www.biblegateway.com/passage/?search="+encodeURIComponent(q.ref)+"&version=ESV";a.classList.remove("hidden");}'
    + 'function hold(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();var card=document.getElementById("inviteCard");if(!card)return;var y=card.getBoundingClientRect().top+window.pageYOffset-8;window.scrollTo(0,Math.max(0,y));}'
    + 'function paint(){var q=queue[qi];if(!q)return;locked=false;var card=document.getElementById("inviteCard");if(card)card.classList.remove("hit");marks();var label=document.getElementById("inviteLabel");if(label)label.textContent="Paul\'s letters";var p=document.getElementById("invitePrompt");if(p)p.textContent=q.prompt;var w=document.getElementById("inviteWhy");if(w)w.textContent=q.book+" \u00b7 "+(qi+1)+" of "+queue.length+". A run adds 25.";var box=document.getElementById("inviteChoices");if(!box)return;var r=rand((qi+3)*131);opts=q.choices.map(function(t,n){return {t:t,ok:n===0};});for(var n=opts.length-1;n>0;n--){var j=Math.floor(r()*(n+1));var tmp=opts[n];opts[n]=opts[j];opts[j]=tmp;}box.innerHTML="";opts.forEach(function(o,i){var b=document.createElement("button");b.className="choice";b.type="button";var k=document.createElement("span");k.className="key";k.textContent=String(i+1);var s=document.createElement("span");s.textContent=o.t;b.appendChild(k);b.appendChild(s);b.onclick=function(){mark(i);};box.appendChild(b);});var page=document.getElementById("invitePage");if(page)page.textContent="";var open=document.getElementById("inviteOpen");if(open)open.classList.add("hidden");["inviteNext","inviteSend","inviteMissed"].forEach(function(id){var el=document.getElementById(id);if(el)el.classList.add("hidden");});startClock();hold();}'
    + 'function remember(q,ok){try{if(typeof qid!=="function"||typeof save==="undefined")return;var id=qid(q);if(save.used.indexOf(id)<0)save.used.push(id);if(!save.right)save.right=[];if(!save.missed)save.missed=[];if(ok){if(save.right.indexOf(id)<0)save.right.push(id);}else if(save.missed.indexOf(id)<0)save.missed.push(id);if(typeof persist==="function")persist();}catch(e){}}'
    + 'function advance(){if(qi<queue.length-1){qi++;paint();}else finish();}'
    + 'function finish(){stopClock();var fresh=score>best;if(fresh){best=score;try{localStorage.setItem("biblePlainlyScore",String(best));}catch(e){}}marks();var p=document.getElementById("invitePrompt");if(p){p.textContent=fresh?score+"  New best":score+"  Finished";p.classList.add("finish");}var w=document.getElementById("inviteWhy");if(w)w.textContent=placed+" placed. "+missed.length+" missed.";var box=document.getElementById("inviteChoices");if(box)box.innerHTML="";var page=document.getElementById("invitePage");if(page)page.textContent="I have finished the race. 2 Timothy 4:7. Same eight today. Send it.";var send=document.getElementById("inviteSend");if(send){send.classList.remove("hidden");send.onclick=function(){var text="I scored "+score+" on today\'s Bible lines. "+placed+" placed. Can you beat it? "+location.href;if(navigator.share)navigator.share({title:"Today\'s Bible lines",text:text}).catch(function(){});else if(page)page.textContent=text;};}var again=document.getElementById("inviteMissed");if(again&&missed.length){again.classList.remove("hidden");again.onclick=function(){queue=missed.slice();missed=[];qi=0;streak=0;paint();};}var next=document.getElementById("inviteNext");if(next){next.classList.remove("hidden");next.textContent="Walk it again";next.onclick=function(){qi=0;placed=0;streak=0;score=0;missed=[];build();paint();};}if(fresh||placed>=5)chime([392,494,587,784],0.08);hold();}'
    + 'function timeUp(){if(locked)return;locked=true;stopClock();streak=0;chime([196],0.05);var q=queue[qi];missed.push(q);remember(q,false);pageLink(q);var buttons=document.querySelectorAll("#inviteChoices button");buttons.forEach(function(b,n){b.disabled=true;if(opts[n]&&opts[n].ok)b.classList.add("right");});var page=document.getElementById("invitePage");if(page)page.textContent="Time is up. "+q.ref+". "+q.plain;var next=document.getElementById("inviteNext");if(next){next.classList.remove("hidden");next.textContent=qi<queue.length-1?"Next line":"See the score";next.onclick=advance;}}'
    + 'function mark(i){if(locked)return;locked=true;stopClock();audio();var q=queue[qi];var ok=!!(opts[i]&&opts[i].ok);var add=0;var buttons=document.querySelectorAll("#inviteChoices button");buttons.forEach(function(b,n){b.disabled=true;if(opts[n].ok)b.classList.add("right");else if(n===i)b.classList.add("wrong");});if(ok){streak++;placed++;add=100+left+(streak>=2?25:0);var was=score;score+=add;var card=document.getElementById("inviteCard");var notes=streak>=5?[392,494,587,659,784]:streak>=3?[392,494,587,784]:streak>=2?[392,494,587]:[392,494];if(best>0&&was<=best&&score>best){notes=[392,494,587,784];if(card)card.classList.add("gold");}else if(card)card.classList.add("hit");chime(notes,streak>=3?0.08:0.06);var pop=document.createElement("div");pop.id="pop";pop.textContent="+"+add;if(card)card.appendChild(pop);setTimeout(function(){if(pop.parentNode)pop.parentNode.removeChild(pop);},700);}else{streak=0;missed.push(q);chime([196],0.05);}marks();remember(q,ok);pageLink(q);var page=document.getElementById("invitePage");if(page)page.textContent=(ok?"Placed. +"+add+". ":"Not that one. ")+q.ref+". "+q.plain;if(ok&&qi<queue.length-1){wait=setTimeout(advance,900);}else{var next=document.getElementById("inviteNext");if(next){next.classList.remove("hidden");next.textContent=qi<queue.length-1?"Next line":"See the score";next.onclick=advance;}}}'
    + 'build();paint();'
    + 'var quit=document.getElementById("inviteQuit");if(quit)quit.onclick=function(){stopClock();qi=0;placed=0;streak=0;score=0;missed=[];build();paint();window.scrollTo(0,0);};'
    + 'var snd=document.getElementById("inviteSound");if(snd)snd.onclick=function(){soundOn=!soundOn;snd.textContent=soundOn?"Sound on":"Sound off";if(soundOn){audio();chime([392,494,587],0.07);}};'
    + 'function liftTab(tab){document.body.classList.remove("tab-other","tab-progress");if(tab&&tab!=="play"){document.body.classList.add("tab-other");if(tab==="progress")document.body.classList.add("tab-progress");}var panel=document.getElementById("tallyPanel");var wrap=document.querySelector(".wrap");if(tab==="progress"&&panel&&wrap){panel.classList.remove("screen-off","hidden");var tally=document.getElementById("tally");if(tally)tally.classList.remove("screen-off","hidden");wrap.insertBefore(panel, wrap.firstChild);panel.style.display="block";}window.scrollTo(0,0);if(panel&&tab==="progress")panel.scrollIntoView({block:"start"});}'
    + 'var dock=document.getElementById("dock");if(dock)dock.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var tab=b.getAttribute("data-tab");setTimeout(function(){liftTab(tab);},40);});'
    + '})();<\/script>';
  function openGame(html){
    html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");
    html=html.replace(/<audio\b[^>]*\/?>/gi,"");
    html=html.replace("const BANK","var BANK");
    html=html.replace("let save","var save");
    html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');
    if(html.indexOf("</head>")!==-1) html=html.replace("</head>", look+"</head>");
    html=html.replace("</body>", hook+"</body>");
    document.open();document.write(html);document.close();
  }
  function fail(){var el=document.getElementById("wait");if(el)el.textContent="The page did not open. Refresh once.";}
  function tryAt(i){
    if(i>=sources.length){fail();return;}
    fetch(sources[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("bad");return r.text();}).then(function(html){
      if(html.indexOf("Sixty-six books")===-1 && html.indexOf("heard the stories")===-1) throw new Error("short");
      openGame(html);
    }).catch(function(){tryAt(i+1);});
  }
