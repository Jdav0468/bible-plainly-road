<script>
(function(){
  var sources=[
    "https://cdn.jsdelivr.net/gh/Jdav0468/bible-plainly-road@208312696c8b4b4702fc9c000791aaf74927f83d/index.html",
    "https://raw.githubusercontent.com/Jdav0468/bible-plainly-road/208312696c8b4b4702fc9c000791aaf74927f83d/index.html"
  ];
  var look = '<style id="look">body{background:#12100e !important;color:#f3eadc !important}.wrap{max-width:560px !important;padding-bottom:120px !important}#inviteCard{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;padding:18px !important}#inviteCard.gold{background:#f8e7b8 !important;box-shadow:0 0 0 3px #c6a36a !important}#inviteHead{display:flex;justify-content:space-between}#inviteClock{font:700 22px/1 Georgia,serif;border:1px solid #8a6430;border-radius:999px;padding:6px 10px;background:#fffaf2}#inviteScore{display:flex;justify-content:space-between;color:#8a6430;font-size:15px}#inviteBarWrap{height:4px;border-radius:99px;background:rgba(154,120,58,.25);margin:8px 0;overflow:hidden}#inviteBar{height:100%;width:0;background:#8a6430}#inviteChoices .choice{display:flex;width:100%;text-align:left;margin:8px 0;min-height:54px;border-radius:16px;border:1px solid rgba(154,120,58,.45);background:#fffaf2;color:#1c1814;font:18px Georgia,serif;padding:12px}#inviteNext{width:100%;min-height:52px;margin-top:8px;border:0;border-radius:999px;background:#1c1814;color:#f4efe4}#inviteRow{display:flex;gap:8px}#inviteQuit,#inviteSound{flex:1;min-height:48px;margin-top:8px;border-radius:999px;border:1px solid #8a6430;background:#fffaf2;color:#1c1814}.hidden{display:none !important}.dock{position:fixed !important;left:0;right:0;bottom:0;z-index:50;display:flex !important;background:#f4efe4 !important;border-top:2px solid #c6a36a !important}.dock button{flex:1 !important;color:#1c1814 !important;font:600 15px Georgia,serif !important;min-height:52px !important;border:0 !important;background:transparent !important}.dock button.on{background:#1c1814 !important;color:#f4efe4 !important;border-radius:14px !important}</style>';
  var card = '<div class="panel" id="inviteCard"><div id="inviteHead"><p id="inviteLabel">Paul\u2019s letters</p><div id="inviteClock">0:30</div></div><p id="inviteScore"><span id="inviteNow">Score 0</span><span id="inviteBest">Set the best</span></p><div id="inviteBarWrap"><div id="inviteBar"></div></div><h2 id="invitePrompt">One line from Paul.</h2><p id="inviteWhy">Run the race. Philippians 3:14.</p><div id="inviteChoices"></div><p id="invitePage"></p><button class="hidden" id="inviteNext" type="button">Next line</button><div id="inviteRow"><button id="inviteQuit" type="button">Main menu</button><button id="inviteSound" type="button">Sound on</button></div></div>';
  var hook = '<script>(function(){function killHymn(){var n=document.querySelectorAll("audio");for(var i=0;i<n.length;i++){n[i].pause();n[i].volume=0;}}window.startMusic=function(){killHymn();};var queue=[],qi=0,locked=false,score=0,opts=[],left=30,clock=0,best=0,ac=null,soundOn=true;try{best=Number(localStorage.getItem("biblePlainlyScore")||0)||0;}catch(e){}function audio(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==="suspended")ac.resume();return ac;}function chime(n){if(!soundOn)return;var ctx=audio();if(!ctx)return;var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=n;g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.3);}function rand(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}function paul(q){return /Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon/.test(q.book||"");}function build(){if(typeof BANK==="undefined")return;var stamp=typeof dayStamp==="function"?dayStamp():"1";var r=rand(Number(String(stamp).replace(/-/g,""))||1);var bag=BANK.filter(paul);for(var n=bag.length-1;n>0;n--){var j=Math.floor(r()*(n+1));var tmp=bag[n];bag[n]=bag[j];bag[j]=tmp;}var seen={};queue=[];for(var i=0;i<bag.length&&queue.length<8;i++){var id=bag[i].book+"|"+bag[i].prompt;if(!seen[id]){seen[id]=1;queue.push(bag[i]);}}}function race(){var gap=best-score;document.getElementById("inviteNow").textContent="Score "+score;document.getElementById("inviteBest").textContent=best<=0?"Set the best":(gap>0?gap+" behind":"New best");var bar=document.getElementById("inviteBar");if(bar)bar.style.width=Math.min(100,Math.round(score/Math.max(best,1)*100))+"%";document.getElementById("inviteCard").classList.toggle("gold", best>0&&score>best);}function paint(){var q=queue[qi];if(!q)return;locked=false;document.getElementById("inviteLabel").textContent="Paul\u2019s letters";document.getElementById("invitePrompt").textContent=q.prompt;document.getElementById("inviteWhy").textContent=q.book+" \u00b7 "+(qi+1)+" of "+queue.length+". Run the race.";race();var c=document.getElementById("inviteClock");left=30;c.textContent="0:30";clearInterval(clock);clock=setInterval(function(){left--;c.textContent="0:"+(left<10?"0"+left:left);if(left<=0){clearInterval(clock);locked=true;}},1000);var r=rand((qi+3)*131);opts=q.choices.map(function(t,n){return {t:t,ok:n===0};});for(var n=opts.length-1;n>0;n--){var j=Math.floor(r()*(n+1));var tmp=opts[n];opts[n]=opts[j];opts[j]=tmp;}var box=document.getElementById("inviteChoices");box.innerHTML="";opts.forEach(function(o,i){var b=document.createElement("button");b.className="choice";b.type="button";b.textContent=(i+1)+"  "+o.t;b.onclick=function(){if(locked)return;locked=true;clearInterval(clock);audio();if(o.ok){score+=100+left;chime(494);if(best>0&&score>best)chime(784);}else chime(196);race();document.getElementById("invitePage").textContent=(o.ok?"Placed. ":"Not that one. ")+q.ref+". "+q.plain;var next=document.getElementById("inviteNext");next.classList.remove("hidden");next.onclick=function(){if(qi<queue.length-1){qi++;paint();}else{if(score>best){best=score;try{localStorage.setItem("biblePlainlyScore",String(best));}catch(e){}}document.getElementById("invitePrompt").textContent=score>best||document.getElementById("inviteBest").textContent==="New best"?"New best. "+score+".":"I have finished the race. "+score+".";document.getElementById("inviteWhy").textContent="2 Timothy 4:7. Same letters today.";box.innerHTML="";race();}};};box.appendChild(b);});}build();paint();document.getElementById("inviteQuit").onclick=function(){qi=0;score=0;build();paint();window.scrollTo(0,0);};document.getElementById("inviteSound").onclick=function(){soundOn=!soundOn;this.textContent=soundOn?"Sound on":"Sound off";};})();<\/script>';
  function openGame(html){html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");html=html.replace("const BANK","var BANK");html=html.replace("let save","var save");html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');if(html.indexOf("</head>")!==-1)html=html.replace("</head>", look+"</head>");html=html.replace("</body>", hook+"</body>");document.open();document.write(html);document.close();}
  function tryAt(i){if(i>=sources.length)return;fetch(sources[i],{cache:"no-store"}).then(function(r){return r.text();}).then(openGame).catch(function(){tryAt(i+1);});}
  tryAt(0);
})();
