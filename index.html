<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bible, Plainly — The Road</title>
<!-- v19 answer counts, music off -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<style>body{margin:0;background:#12100e;color:#e7dccb;font-family:Georgia,serif}p{padding:28px 22px;font-size:18px}</style>
</head>
<body>
<p id="wait">Opening the page…</p>
<script>
(function(){
  var sources=[
    "https://cdn.jsdelivr.net/gh/Jdav0468/bible-plainly-road@208312696c8b4b4702fc9c000791aaf74927f83d/index.html",
    "https://raw.githubusercontent.com/Jdav0468/bible-plainly-road/208312696c8b4b4702fc9c000791aaf74927f83d/index.html"
  ];
  var look = '<style id="look">\nbody{background:radial-gradient(800px 360px at 50% -8%, rgba(198,163,106,.18), transparent 62%), linear-gradient(180deg,#1c1814 0%, #12100e 46%, #0c0b0a 100%) !important;color:#f3eadc !important;}\n.wrap{max-width:560px !important;padding-bottom:96px !important;}\nh1,.wrap h1,.panel h2,.book h2,.prompt,#invitePrompt{font-family:Palatino,Georgia,serif !important;color:#1c1814 !important;}\nh1{font-weight:500 !important;letter-spacing:-.03em !important;font-size:clamp(32px,6vw,44px) !important;}\nh1 em{color:#8a6430 !important;}\n.lede{color:#3c342c !important;font-size:17px !important;}\n#inviteCard{background:#f4efe4 !important;color:#1c1814 !important;border:1px solid rgba(154,120,58,.45) !important;border-radius:22px !important;padding:18px !important;margin:14px 0 !important;}\n#invitePrompt{font-size:clamp(24px,4vw,32px) !important;line-height:1.25 !important;margin:8px 0 8px !important;}\n#inviteWhy,#inviteCount{color:#4a4036 !important;margin:0 0 12px !important;}\n#inviteChoices .choice{width:100%;text-align:left;margin:8px 0;min-height:52px;border-radius:16px;border:1px solid rgba(154,120,58,.45);background:#fffaf2;color:#1c1814;font:18px Georgia,serif;padding:12px 14px;}\n#begin{width:100% !important;min-height:52px !important;border-radius:999px !important;background:#1c1814 !important;color:#f4efe4 !important;font-size:17px !important;}\n.walk,.panel,.book{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;border:1px solid rgba(154,120,58,.4) !important;}\n.dock{background:rgba(14,12,11,.94) !important;border-top:1px solid rgba(198,163,106,.32) !important;}\n.dock button.on{color:#f0dfb4 !important;box-shadow:inset 0 -2px 0 #c6a36a !important;}\n#todayRow{display:none !important;}\n</style>';
  var card = '<div class="panel" id="inviteCard"><p class="qbook">Today’s question</p><h2 id="invitePrompt">One question is on the page.</h2><p class="hint" id="inviteWhy">Tap an answer. The page shows where it sits.</p><div id="inviteChoices"></div><p class="hint" id="inviteCount"></p></div>';
  var hook = '<script>(function(){\nfunction killHymn(){var nodes=document.querySelectorAll("audio");for(var i=0;i<nodes.length;i++){nodes[i].pause();nodes[i].volume=0;nodes[i].removeAttribute("src");}}\nfunction startMusic(){killHymn();}\nfunction stopMusic(){killHymn();}\nwindow.startMusic=startMusic;window.stopMusic=stopMusic;killHymn();\nif(window.HTMLMediaElement){var orig=HTMLMediaElement.prototype.play;HTMLMediaElement.prototype.play=function(){var src=(this.currentSrc||this.src||"")+"";if(this.id==="hymn"||src.indexOf("hymn")!==-1){this.pause();this.volume=0;return Promise.resolve();}return orig.apply(this,arguments);};}\nfunction esc(s){return String(s).replace(/&/g,"&").replace(/<\\/g,"<");}\nfunction paint(){\n  try{\n    if(typeof questionForDay!=="function"||typeof dayStamp!=="function") return;\n    var q=questionForDay(dayStamp());\n    var p=document.getElementById("invitePrompt");\n    if(p) p.textContent=q.prompt;\n    var known=0;\n    try{known=(load().known||[]).length;}catch(e){}\n    var w=document.getElementById("inviteWhy");\n    if(w) w.textContent=q.book+". Tap an answer. You can place "+known+" of 66.";\n    var opts=q.choices.map(function(t,n){return {t:t};});\n    for(var n=opts.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1));var tmp=opts[n];opts[n]=opts[j];opts[j]=tmp;}\n    var box=document.getElementById("inviteChoices");\n    if(!box) return;\n    box.innerHTML=opts.map(function(o,i){return \'<button class="choice" type="button"><span class="key">\'+(i+1)+\'<\\/span><span><\\/span><\\/button>\';}).join("");\n    var buttons=box.querySelectorAll("button");\n    buttons.forEach(function(b,i){\n      b.querySelector("span:last-child").textContent=opts[i].t;\n      b.onclick=function(){\n        var text=opts[i].t;\n        if(typeof startDay==="function") startDay();\n        var answers=document.querySelectorAll("#answers button");\n        for(var k=0;k<answers.length;k++){\n          if(answers[k].textContent.indexOf(text)!==-1){answers[k].click();break;}\n        }\n      };\n    });\n    if(typeof dayCount==="function"){\n      dayCount(dayStamp(), false).then(function(n){\n        var el=document.getElementById("inviteCount");\n        if(el && n) el.textContent=n+" people opened today\\'s question.";\n      });\n    }\n  }catch(e){}\n}\nvar begin=document.getElementById("begin");\nif(begin) begin.textContent="Keep going \u2014 a short walk";\npaint();\n})();<\\/script>';
  function openGame(html){
    html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");
    html=html.replace("const BANK","var BANK");
    html=html.replace("Sixty-six books. It is worth studying because the truth is in the Bible. A church can help, and a preacher can explain, but you still need to open it yourself. A hint can point you to the part. The line is still yours to place.","One question is already on the table. Tap an answer.");
    html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');
    if(html.indexOf("</head>")!==-1) html=html.replace("</head>", look+"</head>");
    html=html.replace("</body>", hook+"</body>");
    document.open();document.write(html);document.close();
  }
  function fail(){var el=document.getElementById("wait");if(el)el.textContent="The page did not open. Refresh once.";}
  function tryAt(i){
    if(i>=sources.length){fail();return;}
    fetch(sources[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("bad");return r.text();}).then(function(html){
      if(html.indexOf("Sixty-six books")===-1) throw new Error("short");
      openGame(html);
    }).catch(function(){tryAt(i+1);});
  }
  tryAt(0);
})();
</script>
</body>
</html>
