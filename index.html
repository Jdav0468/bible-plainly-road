<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bible, Plainly — The Road</title>
<!-- v23 place five, music off -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<style>body{margin:0;background:#12100e;color:#e7dccb;font-family:Georgia,serif}p{padding:28px 22px;font-size:18px}</style>
</head>
<body>
<p id="wait">Opening the page…</p>
<script>
(function(){
  var sources=[
    "https://cdn.jsdelivr.net/gh/Jdav0468/bible-plainly-road@208312696c8b4b4702fc9c000791aaf74927f83d/index.html",
    "https://raw.githubusercontent.com/Jdav0468/bible-plainly-road/208312696c8b4b4702fc9c000791aaf74927f83d/index.html"
  ];
  var look = '<style id="look">'
    + 'body{background:radial-gradient(800px 360px at 50% -8%, rgba(198,163,106,.18), transparent 62%), linear-gradient(180deg,#1c1814 0%, #12100e 46%, #0c0b0a 100%) !important;color:#f3eadc !important;}'
    + '.wrap{max-width:560px !important;padding-bottom:96px !important;}'
    + 'h1,.panel h2,.book h2,.prompt,#invitePrompt{font-family:Palatino,Georgia,serif !important;color:#1c1814 !important;}'
    + 'h1 em{color:#8a6430 !important;}'
    + '.lede{display:none !important;}'
    + '#inviteCard{background:#f4efe4 !important;color:#1c1814 !important;border:1px solid rgba(154,120,58,.45) !important;border-radius:22px !important;padding:18px !important;margin:8px 0 14px !important;}'
    + '#inviteCard.turn{animation:turn .28s ease;}'
    + '@keyframes turn{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}'
    + '#invitePrompt{font-size:28px;line-height:1.25;margin:8px 0;}'
    + '#inviteWhy,#invitePage{color:#4a4036 !important;}'
    + '#inviteMarks{display:flex;gap:8px;margin:0 0 10px;}'
    + '#inviteMarks i{width:16px;height:16px;border-radius:50%;border:1.5px solid #8a6430;background:transparent;display:block;}'
    + '#inviteMarks i.on{background:#8a6430;box-shadow:0 0 0 4px rgba(138,100,48,.18);}'
    + '#inviteTrack{height:4px;border-radius:99px;background:rgba(154,120,58,.25);margin:0 0 12px;overflow:hidden;}'
    + '#inviteBar{height:100%;width:0;background:#8a6430;transition:width .25s ease;}'
    + '#inviteChoices .choice{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0;min-height:54px;border-radius:16px;border:1px solid rgba(154,120,58,.45);background:#fffaf2;color:#1c1814;font:18px Georgia,serif;padding:12px 14px;transition:transform .08s ease,background .15s ease;}'
    + '#inviteChoices .choice:active{transform:scale(.98);}'
    + '#inviteChoices .choice.right{background:#e5efe6;border-color:#2c5a42;transform:scale(1.01);}'
    + '#inviteChoices .choice.wrong{background:#f6e6e1;border-color:#8a4036;animation:shake .35s linear;}'
    + '@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}'
    + '#inviteNext,#inviteAgain{width:100%;min-height:54px;margin-top:8px;border:0;border-radius:999px;background:#1c1814;color:#f4efe4;font:18px Georgia,serif;}'
    + '#inviteAgain{background:transparent;color:#1c1814;border:1px solid rgba(154,120,58,.55);}'
    + '.hidden{display:none !important;}'
    + '.key{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#1c1814;color:#f4efe4;font-size:13px;flex:none;}'
    + '#startPanel,#todayRow,#sound,.sound{display:none !important;}'
    + '.walk,.panel,.book{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;border:1px solid rgba(154,120,58,.4) !important;}'
    + '.dock{background:rgba(14,12,11,.94) !important;border-top:1px solid rgba(198,163,106,.32) !important;}'
    + '.dock button.on{color:#f0dfb4 !important;box-shadow:inset 0 -2px 0 #c6a36a !important;}'
    + '</style>';
  var card = '<div class="panel" id="inviteCard"><p class="qbook" id="inviteLabel">Place five</p><div id="inviteMarks"></div><div id="inviteTrack"><div id="inviteBar"></div></div><h2 id="invitePrompt">One question is on the page.</h2><p class="hint" id="inviteWhy">Tap an answer.</p><div id="inviteChoices"></div><p class="hint" id="invitePage"></p><button class="hidden" id="inviteNext" type="button">Next line</button><button class="hidden" id="inviteAgain" type="button">Walk it again</button></div>';
  var hook = '<script>(function(){'
    + 'function killHymn(){var nodes=document.querySelectorAll("audio");for(var i=0;i<nodes.length;i++){nodes[i].pause();nodes[i].volume=0;nodes[i].removeAttribute("src");}}'
    + 'window.startMusic=function(){killHymn();};window.stopMusic=window.startMusic;killHymn();'
    + 'var queue=[], qi=0, locked=false, streak=0, placed=0, opts=[], best=0;'
    + 'try{best=Number(localStorage.getItem("biblePlainlyWalkBest")||0)||0;}catch(e){}'
    + 'function shuffle(a){for(var n=a.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1));var t=a[n];a[n]=a[j];a[j]=t;}return a;}'
    + 'function build(){if(typeof questionForDay!=="function"||typeof BANK==="undefined")return;var today=questionForDay(dayStamp());var seen={};seen[today.book+"|"+today.prompt]=1;queue=[today];var bag=shuffle(BANK.slice());for(var i=0;i<bag.length&&queue.length<8;i++){var q=bag[i];var id=q.book+"|"+q.prompt;if(!seen[id]){seen[id]=1;queue.push(q);}}}'
    + 'function marks(){var m=document.getElementById("inviteMarks");if(!m)return;var h="";for(var i=0;i<5;i++)h+="<i class=\\""+(i<placed?"on":"")+"\\"></i>";m.innerHTML=h;}'
    + 'function keepBest(){if(placed>best){best=placed;try{localStorage.setItem("biblePlainlyWalkBest",String(best));}catch(e){}}}'
    + 'function paint(){var q=queue[qi];if(!q)return;locked=false;var card=document.getElementById("inviteCard");if(card){card.classList.remove("turn");void card.offsetWidth;card.classList.add("turn");}var label=document.getElementById("inviteLabel");if(label)label.textContent=placed>=5?"Five placed":"Place five";marks();var p=document.getElementById("invitePrompt");if(p)p.textContent=q.prompt;var w=document.getElementById("inviteWhy");if(w)w.textContent=q.book+" \u00b7 "+(qi+1)+" of "+queue.length+" \u00b7 "+placed+" placed"+(best?" \u00b7 best "+best:"");var bar=document.getElementById("inviteBar");if(bar)bar.style.width=Math.round((qi/queue.length)*100)+"%";opts=shuffle(q.choices.map(function(t,n){return {t:t,ok:n===0};}));var box=document.getElementById("inviteChoices");if(!box)return;box.innerHTML="";opts.forEach(function(o,i){var b=document.createElement("button");b.className="choice";b.type="button";var k=document.createElement("span");k.className="key";k.textContent=String(i+1);var s=document.createElement("span");s.textContent=o.t;b.appendChild(k);b.appendChild(s);b.onclick=function(){mark(i);};box.appendChild(b);});var page=document.getElementById("invitePage");if(page)page.textContent="";var next=document.getElementById("inviteNext");if(next)next.classList.add("hidden");var again=document.getElementById("inviteAgain");if(again)again.classList.add("hidden");}'
    + 'function remember(q,ok){try{if(typeof qid!=="function"||typeof save==="undefined")return;var id=qid(q);if(save.used.indexOf(id)<0)save.used.push(id);save.notes[q.book]={ref:q.ref,plain:q.plain};if(!save.right)save.right=[];if(!save.missed)save.missed=[];if(ok){if(save.right.indexOf(id)<0)save.right.push(id);save.missed=save.missed.filter(function(x){return x!==id;});}else{save.right=save.right.filter(function(x){return x!==id;});if(save.missed.indexOf(id)<0)save.missed.push(id);}if(typeof refreshBook==="function")refreshBook(q.book);if(typeof persist==="function")persist();if(typeof tone==="function")tone(ok);}catch(e){}}'
    + 'function finish(){keepBest();var page=document.getElementById("invitePage");if(page)page.textContent="You placed "+placed+" of "+queue.length+". Best walk: "+best+".";var w=document.getElementById("inviteWhy");if(w)w.textContent=placed>=5?"Five placed. The page stayed with you.":"Short of five. The line is still on the page.";var again=document.getElementById("inviteAgain");if(again){again.classList.remove("hidden");again.onclick=function(){qi=0;placed=0;streak=0;build();paint();};}}'
    + 'function mark(i){if(locked)return;locked=true;var q=queue[qi];var ok=opts[i].ok;var buttons=document.querySelectorAll("#inviteChoices button");buttons.forEach(function(b,n){b.disabled=true;if(opts[n].ok)b.classList.add("right");else if(n===i)b.classList.add("wrong");});if(ok){streak++;placed++;}else streak=0;keepBest();marks();remember(q,ok);var page=document.getElementById("invitePage");if(page){var line=ok?"Placed. ":"Not that one. ";page.textContent=line+q.ref+". "+q.plain+(streak>=3?"  "+streak+" in a row.":placed===5?"  Five placed.":""); }var next=document.getElementById("inviteNext");if(next){next.classList.remove("hidden");next.textContent=qi<queue.length-1?"Next line":"See the walk";next.onclick=function(){if(qi<queue.length-1){qi++;paint();}else finish();};}}'
    + 'build();paint();'
    + '})();<\/script>';
  function openGame(html){
    html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");
    html=html.replace(/<audio\b[^>]*\/?>/gi,"");
    html=html.replace("const BANK","var BANK");
    html=html.replace("let save","var save");
    html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');
    if(html.indexOf("</head>")!==-1) html=html.replace("</head>", look+"</head>");
    html=html.replace("</body>", hook+"</body>");
    document.open();document.write(html);document.close();
  }
  function fail(){var el=document.getElementById("wait");if(el)el.textContent="The page did not open. Refresh once.";}
  function tryAt(i){
    if(i>=sources.length){fail();return;}
    fetch(sources[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("bad");return r.text();}).then(function(html){
      if(html.indexOf("Sixty-six books")===-1 && html.indexOf("heard the stories")===-1) throw new Error("short");
      openGame(html);
    }).catch(function(){tryAt(i+1);});
  }
  tryAt(0);
})();
</script>
</body>
</html>
