<script>
(function(){
  var sources=[
    "https://cdn.jsdelivr.net/gh/Jdav0468/bible-plainly-road@208312696c8b4b4702fc9c000791aaf74927f83d/index.html",
    "https://raw.githubusercontent.com/Jdav0468/bible-plainly-road/208312696c8b4b4702fc9c000791aaf74927f83d/index.html"
  ];
  var look = '<style id="look">'
    + 'body{background:radial-gradient(800px 360px at 50% -8%, rgba(198,163,106,.22), transparent 62%), linear-gradient(180deg,#1c1814 0%, #12100e 46%, #0c0b0a 100%) !important;color:#f3eadc !important;}'

    + '@keyframes pulse{50%{transform:scale(1.06)}}'

    + '#inviteRow{display:flex;gap:8px;}'
    + '#inviteRow button{flex:1;}'
    + '.hidden{display:none !important;}'
    + '.key{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#1c1814;color:#f4efe4;font-size:13px;flex:none;}'
    + '.dock{position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;z-index:50 !important;display:flex !important;background:#f4efe4 !important;border-top:2px solid #c6a36a !important;padding:8px 8px calc(8px + env(safe-area-inset-bottom)) !important;}'
    + '.dock button{flex:1 !important;color:#1c1814 !important;background:transparent !important;font:600 15px/1.2 Georgia,serif !important;min-height:52px !important;border-radius:14px !important;border:0 !important;}'
    + '.dock button.on{background:#1c1814 !important;color:#f4efe4 !important;}'
    + '.walk,.panel,.book{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;}'
    + '</style>';
  var card = '<div class="panel" id="inviteCard"><div id="inviteHead"><p class="qbook" id="inviteLabel">Place five</p><div id="inviteClock">0:30</div></div><p id="inviteScore"><span id="inviteNow">0</span><span id="inviteBest">Best 0</span></p><div id="inviteMarks"></div><h2 id="invitePrompt">One question is on the page.</h2><p class="hint" id="inviteWhy">Same eight lines today. Faster adds more.</p><div id="inviteChoices"></div><p class="hint" id="invitePage"></p><button class="hidden" id="inviteNext" type="button">Next line</button><button class="hidden" id="inviteSend" type="button">Send this walk</button><div id="inviteRow"><button id="inviteQuit" type="button">Main menu</button><button id="inviteSound" type="button">Sound on</button></div></div>';
  var hook = '<script>(function(){'
    + 'function killHymn(){var nodes=document.querySelectorAll("audio");for(var i=0;i<nodes.length;i++){nodes[i].pause();nodes[i].volume=0;nodes[i].removeAttribute("src");}}'
    + 'window.startMusic=function(){killHymn();};window.stopMusic=window.startMusic;killHymn();'
    + 'var queue=[], qi=0, locked=false, streak=0, placed=0, score=0, best=0, dayN=1, opts=[], left=30, clock=0, ac=null, soundOn=true, timer=0, stamp="";'
    + 'function today(){return (typeof dayStamp==="function")?dayStamp():new Date().toISOString().slice(0,10);}'
    + 'function loadMeta(){stamp=today();try{best=Number(localStorage.getItem("biblePlainlyWalkScore")||0)||0;var last=localStorage.getItem("biblePlainlyLastDay")||"";var n=Number(localStorage.getItem("biblePlainlyDayStreak")||0)||0;var y=new Date();y.setDate(y.getDate()-1);var ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");if(last===stamp)dayN=n||1;else if(last===ys)dayN=(n||0)+1;else dayN=1;localStorage.setItem("biblePlainlyLastDay",stamp);localStorage.setItem("biblePlainlyDayStreak",String(dayN));}catch(e){}}'
    + 'function audio(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==="suspended")ac.resume();return ac;}'
    + 'function chime(notes,gain){if(!soundOn)return;var ctx=audio();if(!ctx)return;var t=ctx.currentTime;notes.forEach(function(n,i){var o=ctx.createOscillator();var g=ctx.createGain();o.type="sine";o.frequency.value=n;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22+i*0.08);o.connect(g);g.connect(ctx.destination);o.start(t+i*0.07);o.stop(t+0.34+i*0.08);});}'
    + 'function sparks(){var card=document.getElementById("inviteCard");if(!card)return;for(var i=0;i<8;i++){var s=document.createElement("i");s.className="spark";s.style.left="50%";s.style.top="36%";s.style.setProperty("--x",((Math.random()-.5)*140)+"px");s.style.setProperty("--y",((-20-Math.random()*80))+"px");card.appendChild(s);setTimeout(function(n){return function(){if(n.parentNode)n.parentNode.removeChild(n);};}(s),700);}}'
    + 'function rand(){var n=0;for(var i=0;i<stamp.length;i++)n=(n*33+stamp.charCodeAt(i))>>>0;return function(){n=(1664525*n+1013904223)>>>0;return n/4294967296;};}'
    + 'function build(){if(typeof questionForDay!=="function"||typeof BANK==="undefined")return;var todayQ=questionForDay(stamp);var seen={};seen[todayQ.book+"|"+todayQ.prompt]=1;queue=[todayQ];var bag=BANK.slice();var r=rand();for(var i=bag.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=bag[i];bag[i]=bag[j];bag[j]=t;}for(var k=0;k<bag.length&&queue.length<8;k++){var q=bag[k];var id=q.book+"|"+q.prompt;if(!seen[id]){seen[id]=1;queue.push(q);}}}'
    + 'function showClock(){var c=document.getElementById("inviteClock");if(!c)return;c.textContent="0:"+(left<10?"0"+left:left);c.classList.toggle("low", left<=5);}'
    + 'function showScore(){var n=document.getElementById("inviteNow");if(n)n.textContent=score+" \u00b7 "+placed+" placed";var b=document.getElementById("inviteBest");if(b)b.textContent="Best "+best;var s=document.getElementById("inviteScore");if(s)s.classList.toggle("new", score>0&&score>=best);}'
    + 'function stopClock(){clearInterval(clock);clock=0;clearTimeout(timer);}'
    + 'function startClock(){stopClock();left=30;showClock();clock=setInterval(function(){left--;showClock();if(left>0&&left<=5)chime([660],0.03);if(left<=0)timeUp();},1000);}'
    + 'function marks(){var m=document.getElementById("inviteMarks");if(!m)return;var h="";for(var i=0;i<5;i++)h+="<i"+(i<placed?" class=\\"on\\"":"")+"><\\/i>";m.innerHTML=h;}'
    + 'function remember(q,ok){try{if(typeof qid!=="function"||typeof save==="undefined")return;var id=qid(q);if(save.used.indexOf(id)<0)save.used.push(id);if(!save.right)save.right=[];if(!save.missed)save.missed=[];if(ok){if(save.right.indexOf(id)<0)save.right.push(id);}else if(save.missed.indexOf(id)<0)save.missed.push(id);if(typeof persist==="function")persist();}catch(e){}}'
    + 'function keepBest(){if(score>best){best=score;try{localStorage.setItem("biblePlainlyWalkScore",String(best));}catch(e){}}showScore();}'
    + 'function shareText(){return "I scored "+score+" on today\u2019s eight. Can you beat it? https://jdav0468.github.io/bible-plainly-road/?v=29";}'
    + 'function finish(){stopClock();keepBest();chime([392,494,587,784],0.08);sparks();var card=document.getElementById("inviteCard");if(card)card.classList.add("glow");var p=document.getElementById("invitePrompt");if(p)p.textContent=score+" on today\u2019s eight.";var w=document.getElementById("inviteWhy");if(w)w.textContent=placed+" of 8 placed. Day "+dayN+". "+(score>0&&score===best?"New best.":"Best "+best+".");var box=document.getElementById("inviteChoices");if(box)box.innerHTML="";var page=document.getElementById("invitePage");if(page)page.textContent="Send it. A friend gets the same eight.";var next=document.getElementById("inviteNext");if(next){next.classList.remove("hidden");next.textContent="Walk it again";next.onclick=function(){qi=0;placed=0;streak=0;score=0;build();paint();};}var send=document.getElementById("inviteSend");if(send){send.classList.remove("hidden");send.onclick=function(){var text=shareText();if(navigator.share){navigator.share({title:"Can you beat today\u2019s eight?",text:text}).catch(function(){});}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){send.textContent="Copied";});}else if(page)page.textContent=text;};}}'
    + 'function paint(){var q=queue[qi];if(!q)return;locked=false;var card=document.getElementById("inviteCard");if(card){card.classList.remove("turn");void card.offsetWidth;card.classList.add("turn");}var label=document.getElementById("inviteLabel");if(label)label.textContent=placed>=5?"Five placed":"Place five";marks();showScore();var p=document.getElementById("invitePrompt");if(p)p.textContent=q.prompt;var w=document.getElementById("inviteWhy");if(w)w.textContent=q.book+" \u00b7 "+(qi+1)+" of 8 \u00b7 day "+dayN;opts=q.choices.map(function(t,n){return {t:t,ok:n===0};});for(var n=opts.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1));var t=opts[n];opts[n]=opts[j];opts[j]=t;}var box=document.getElementById("inviteChoices");if(!box)return;box.innerHTML="";opts.forEach(function(o,i){var b=document.createElement("button");b.className="choice";b.type="button";var k=document.createElement("span");k.className="key";k.textContent=String(i+1);var s=document.createElement("span");s.textContent=o.t;b.appendChild(k);b.appendChild(s);b.onclick=function(){mark(i);};box.appendChild(b);});var page=document.getElementById("invitePage");if(page)page.textContent="";var next=document.getElementById("inviteNext");if(next)next.classList.add("hidden");var send=document.getElementById("inviteSend");if(send){send.classList.add("hidden");send.textContent="Send this walk";}startClock();}'
    + 'function after(ok){var next=document.getElementById("inviteNext");if(qi>=queue.length-1){if(next){next.classList.remove("hidden");next.textContent="See the walk";next.onclick=finish;}}else if(ok){timer=setTimeout(function(){qi++;paint();},850);}else if(next){next.classList.remove("hidden");next.textContent="Next line";next.onclick=function(){qi++;paint();};}}'
    + 'function mark(i){if(locked)return;locked=true;stopClock();audio();var q=queue[qi];var ok=opts[i].ok;var gain=100+Math.max(left,0);if(ok){streak++;placed++;score+=gain+(streak>=3?20:0);chime([392,494,587],0.07);sparks();if(placed===5)chime([392,494,587,784],0.08);}else{streak=0;chime([196],0.05);}keepBest();marks();remember(q,ok);var buttons=document.querySelectorAll("#inviteChoices button");buttons.forEach(function(b,n){b.disabled=true;if(opts[n].ok)b.classList.add("right");else if(n===i)b.classList.add("wrong");});var page=document.getElementById("invitePage");if(page)page.textContent=(ok?"Placed. +"+gain+". ":"Not that one. ")+q.ref+". "+q.plain+(streak>=2?"  "+streak+" in a row.":"");after(ok);}'
    + 'function timeUp(){if(locked)return;locked=true;stopClock();chime([196],0.05);var q=queue[qi];streak=0;remember(q,false);var buttons=document.querySelectorAll("#inviteChoices button");buttons.forEach(function(b,n){b.disabled=true;if(opts[n]&&opts[n].ok)b.classList.add("right");});var page=document.getElementById("invitePage");if(page)page.textContent="Time. "+q.ref+". "+q.plain;after(false);}'
    + 'loadMeta();build();paint();'
    + 'var quit=document.getElementById("inviteQuit");if(quit)quit.onclick=function(){stopClock();qi=0;placed=0;streak=0;score=0;build();paint();window.scrollTo(0,0);};'
    + 'var snd=document.getElementById("inviteSound");if(snd)snd.onclick=function(){soundOn=!soundOn;snd.textContent=soundOn?"Sound on":"Sound off";if(soundOn){audio();chime([392,494,587],0.07);}};'
    + '})();<\/script>';
  function openGame(html){
    html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");
    html=html.replace(/<audio\b[^>]*\/?>/gi,"");
    html=html.replace("const BANK","var BANK");
    html=html.replace("let save","var save");
    html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');
    if(html.indexOf("</head>")!==-1) html=html.replace("</head>", look+"</head>");
    html=html.replace("</body>", hook+"</body>");
    document.open();document.write(html);document.close();
  }
  function fail(){var el=document.getElementById("wait");if(el)el.textContent="The page did not open. Refresh once.";}
  function tryAt(i){
    if(i>=sources.length){fail();return;}
    fetch(sources[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("bad");return r.text();}).then(function(html){
      if(html.indexOf("Sixty-six books")===-1 && html.indexOf("heard the stories")===-1) throw new Error("short");
      openGame(html);
    }).catch(function(){tryAt(i+1);});
  }
  tryAt(0);
})();
</script>
