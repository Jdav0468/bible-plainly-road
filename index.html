</head>
<body>
<p id="wait">Opening the page…</p>
<script>
(function(){
  var sources=[
    "https://cdn.jsdelivr.net/gh/Jdav0468/bible-plainly-road@208312696c8b4b4702fc9c000791aaf74927f83d/index.html",
    "https://raw.githubusercontent.com/Jdav0468/bible-plainly-road/208312696c8b4b4702fc9c000791aaf74927f83d/index.html"
  ];
  var look = '<style id="look">\nbody{background:radial-gradient(800px 360px at 50% -8%, rgba(198,163,106,.18), transparent 62%), linear-gradient(180deg,#1c1814 0%, #12100e 46%, #0c0b0a 100%) !important;color:#f3eadc !important;}\n.wrap{max-width:560px !important;padding-bottom:96px !important;}\nh1,.wrap h1,.panel h2,.book h2,.prompt,#invitePrompt{font-family:Palatino,Georgia,serif !important;color:#1c1814 !important;}\nh1{font-weight:500 !important;letter-spacing:-.03em !important;font-size:clamp(30px,6vw,42px) !important;}\nh1 em{color:#8a6430 !important;}\n.lede{display:none !important;}\n#inviteCard{background:#f4efe4 !important;color:#1c1814 !important;border:1px solid rgba(154,120,58,.45) !important;border-radius:22px !important;padding:18px !important;margin:8px 0 14px !important;}\n#inviteCard.turn{animation:turn .28s ease;}\n@keyframes turn{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}\n#invitePrompt{font-size:clamp(24px,4vw,32px) !important;line-height:1.25 !important;margin:8px 0 8px !important;}\n#inviteWhy,#invitePage{color:#4a4036 !important;margin:0 0 12px !important;}\n#inviteTrack{height:4px;border-radius:99px;background:rgba(154,120,58,.25);margin:0 0 12px;overflow:hidden;}\n#inviteBar{height:100%;width:0;background:#8a6430;transition:width .25s ease;}\n#inviteChoices .choice{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0;min-height:54px;border-radius:16px;border:1px solid rgba(154,120,58,.45);background:#fffaf2;color:#1c1814;font:18px Georgia,serif;padding:12px 14px;transition:transform .08s ease,background .15s ease;}\n#inviteChoices .choice:active{transform:scale(.98);}\n#inviteChoices .choice.right{background:#e5efe6;border-color:#2c5a42;}\n#inviteChoices .choice.wrong{background:#f6e6e1;border-color:#8a4036;}\n#inviteChoices .choice.shake{animation:shake .35s linear;}\n@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}\n#inviteNext{width:100%;min-height:54px;margin-top:8px;border:0;border-radius:999px;background:#1c1814;color:#f4efe4;font:18px Georgia,serif;}\n#inviteNext.hidden{display:none;}\n.key{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#1c1814;color:#f4efe4;font-size:13px;flex:none;}\n#startPanel,#todayRow,#sound{display:none !important;}\n.walk,.panel,.book{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;border:1px solid rgba(154,120,58,.4) !important;}\n.dock{background:rgba(14,12,11,.94) !important;border-top:1px solid rgba(198,163,106,.32) !important;}\n.dock button.on{color:#f0dfb4 !important;box-shadow:inset 0 -2px 0 #c6a36a !important;}\n</style>';
  var card = '<div class="panel" id="inviteCard"><p class="qbook" id="inviteLabel">Today’s question</p><div id="inviteTrack"><div id="inviteBar"></div></div><h2 id="invitePrompt">One question is on the page.</h2><p class="hint" id="inviteWhy">Tap an answer.</p><div id="inviteChoices"></div><p class="hint" id="invitePage"></p><button class="hidden" id="inviteNext" type="button">Next</button></div>';
  var hook = '<script>(function(){\nfunction killHymn(){var nodes=document.querySelectorAll("audio");for(var i=0;i<nodes.length;i++){nodes[i].pause();nodes[i].volume=0;nodes[i].removeAttribute("src");}}\nfunction startMusic(){killHymn();}\nfunction stopMusic(){killHymn();}\nwindow.startMusic=startMusic;window.stopMusic=stopMusic;killHymn();\nif(window.HTMLMediaElement){var orig=HTMLMediaElement.prototype.play;HTMLMediaElement.prototype.play=function(){var src=(this.currentSrc||this.src||"")+"";if(this.id==="hymn"||src.indexOf("hymn")!==-1){this.pause();this.volume=0;return Promise.resolve();}return orig.apply(this,arguments);};}\nvar queue=[], qi=0, locked=false, streak=0, opts=[];\nfunction shuffle(a){for(var n=a.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1));var t=a[n];a[n]=a[j];a[j]=t;}return a;}\nfunction build(){\n  if(typeof questionForDay!=="function"||typeof BANK==="undefined") return;\n  var today=questionForDay(dayStamp());\n  var seen={}; seen[today.book+"|"+today.prompt]=1; queue=[today];\n  var bag=shuffle(BANK.slice());\n  for(var i=0;i<bag.length && queue.length<8;i++){\n    var q=bag[i]; var id=q.book+"|"+q.prompt;\n    if(!seen[id]){seen[id]=1; queue.push(q);}\n  }\n}\nfunction knownCount(){try{return (load().known||[]).length;}catch(e){return 0;}}\nfunction paint(){\n  var q=queue[qi]; if(!q) return;\n  locked=false;\n  var card=document.getElementById("inviteCard");\n  if(card){card.classList.remove("turn"); void card.offsetWidth; card.classList.add("turn");}\n  var label=document.getElementById("inviteLabel");\n  if(label) label.textContent = qi===0 ? "Today\u2019s question" : "Keep going";\n  var p=document.getElementById("invitePrompt"); if(p) p.textContent=q.prompt;\n  var w=document.getElementById("inviteWhy");\n  if(w) w.textContent=q.book+" \u00b7 "+(qi+1)+" of "+queue.length+" \u00b7 "+knownCount()+" of 66 placed";\n  var bar=document.getElementById("inviteBar"); if(bar) bar.style.width=Math.round((qi/queue.length)*100)+"%";\n  opts=shuffle(q.choices.map(function(t,n){return {t:t, ok:n===0};}));\n  var box=document.getElementById("inviteChoices"); if(!box) return;\n  box.innerHTML="";\n  opts.forEach(function(o,i){\n    var b=document.createElement("button");\n    b.className="choice"; b.type="button";\n    var k=document.createElement("span"); k.className="key"; k.textContent=String(i+1);\n    var s=document.createElement("span"); s.textContent=o.t;\n    b.appendChild(k); b.appendChild(s);\n    b.onclick=function(){mark(i);};\n    box.appendChild(b);\n  });\n  var page=document.getElementById("invitePage"); if(page){page.textContent=""; page.className="hint";}\n  var next=document.getElementById("inviteNext"); if(next) next.classList.add("hidden");\n}\nfunction remember(q, ok){\n  try{\n    if(typeof qid!=="function" || typeof save==="undefined") return;\n    var id=qid(q);\n    if(save.used.indexOf(id)<0) save.used.push(id);\n    save.notes[q.book]={ref:q.ref, plain:q.plain};\n    if(!save.right) save.right=[];\n    if(!save.missed) save.missed=[];\n    if(ok){ if(save.right.indexOf(id)<0) save.right.push(id); save.missed=save.missed.filter(function(x){return x!==id;}); }\n    else { save.right=save.right.filter(function(x){return x!==id;}); if(save.missed.indexOf(id)<0) save.missed.push(id); }\n    if(typeof refreshBook==="function") refreshBook(q.book);\n    if(typeof persist==="function") persist();\n    if(typeof tone==="function") tone(ok);\n  }catch(e){}\n}\nfunction mark(i){\n  if(locked) return; locked=true;\n  var q=queue[qi]; var ok=opts[i].ok;\n  var buttons=document.querySelectorAll("#inviteChoices button");\n  buttons.forEach(function(b,n){\n    b.disabled=true;\n    if(opts[n].ok) b.classList.add("right");\n    else if(n===i){ b.classList.add("wrong"); b.classList.add("shake"); }\n  });\n  if(ok) streak++; else streak=0;\n  remember(q, ok);\n  var page=document.getElementById("invitePage");\n  if(page) page.textContent=(ok?"Right. ":"Not that one. ")+q.ref+". "+q.plain+(streak>=2?"  "+streak+" in a row.":"");\n  var next=document.getElementById("inviteNext");\n  if(next){\n    next.classList.remove("hidden");\n    next.textContent = qi<queue.length-1 ? "Next" : "That is the walk";\n    next.onclick=function(){\n      if(qi<queue.length-1){ qi++; paint(); }\n      else {\n        var w=document.getElementById("inviteWhy");\n        if(w) w.textContent="You can place "+knownCount()+" of 66. Open any book when you want the rest.";\n        next.classList.add("hidden");\n      }\n    };\n  }\n}\nbuild(); paint();\nvar sound=document.getElementById("sound"); if(sound) sound.style.display="none";\n})();<\\/script>';
  function openGame(html){
    html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");
    html=html.replace("const BANK","var BANK");
    html=html.replace("let save","var save");
    html=html.replace("Sixty-six books. It is worth studying because the truth is in the Bible. A church can help, and a preacher can explain, but you still need to open it yourself. A hint can point you to the part. The line is still yours to place.","Tap the answer. The page shows where it sits. Then the next line is already there.");
    html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');
    if(html.indexOf("</head>")!==-1) html=html.replace("</head>", look+"</head>");
    html=html.replace("</body>", hook+"</body>");
    document.open();document.write(html);document.close();
  }
  function fail(){var el=document.getElementById("wait");if(el)el.textContent="The page did not open. Refresh once.";}
  function tryAt(i){
    if(i>=sources.length){fail();return;}
    fetch(sources[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("bad");return r.text();}).then(function(html){
      if(html.indexOf("Sixty-six books")===-1) throw new Error("short");
      openGame(html);
    }).catch(function(){tryAt(i+1);});
  }
  tryAt(0);
})();
</script>
</body>
</html>
