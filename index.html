  var look = '<style id="look">body{background:#12100e !important;color:#f3eadc !important}.wrap{max-width:560px !important;padding-bottom:120px !important}#inviteCard{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;padding:18px !important}#inviteHead{display:flex;justify-content:space-between}#inviteClock{font:700 22px/1 Georgia,serif;border:1px solid #8a6430;border-radius:999px;padding:6px 10px;background:#fffaf2}#inviteChoices .choice{display:flex;width:100%;text-align:left;margin:8px 0;min-height:54px;border-radius:16px;border:1px solid rgba(154,120,58,.45);background:#fffaf2;color:#1c1814;font:18px Georgia,serif;padding:12px}#inviteNext{width:100%;min-height:52px;margin-top:8px;border:0;border-radius:999px;background:#1c1814;color:#f4efe4;font:17px Georgia,serif}#inviteRow{display:flex;gap:8px}#inviteQuit,#inviteSound{flex:1;min-height:48px;margin-top:8px;border-radius:999px;border:1px solid #8a6430;background:#fffaf2;color:#1c1814;font:15px Georgia,serif}.hidden{display:none !important}.dock{position:fixed !important;left:0;right:0;bottom:0;z-index:50;display:flex !important;background:#f4efe4 !important;border-top:2px solid #c6a36a !important}.dock button{flex:1 !important;color:#1c1814 !important;font:600 15px Georgia,serif !important;min-height:52px !important;border:0 !important;background:transparent !important}.dock button.on{background:#1c1814 !important;color:#f4efe4 !important;border-radius:14px !important}#know{background:#f4efe4 !important;color:#1c1814 !important;border-radius:22px !important;padding:18px !important}</style>';
  var card = '<div class="panel" id="inviteCard"><div id="inviteHead"><p>Today\u2019s lines</p><div id="inviteClock">0:30</div></div><p><span id="inviteNow">Score 0</span> <span id="inviteBest">Best 0</span></p><h2 id="invitePrompt">One question is on the page.</h2><p id="inviteWhy"></p><div id="inviteChoices"></div><p id="invitePage"></p><button class="hidden" id="inviteNext" type="button">Next line</button><div id="inviteRow"><button id="inviteQuit" type="button">Main menu</button><button id="inviteSound" type="button">Sound on</button></div></div>';
  var hook = '<script>(function(){function killHymn(){var n=document.querySelectorAll("audio");for(var i=0;i<n.length;i++){n[i].pause();n[i].volume=0;}}window.startMusic=function(){killHymn();};window.stopMusic=window.startMusic;var queue=[],qi=0,locked=false,score=0,opts=[],left=30,clock=0,ac=null,soundOn=true,best=0;try{best=Number(localStorage.getItem("biblePlainlyScore")||0)||0;}catch(e){}function audio(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==="suspended")ac.resume();return ac;}function chime(n,g){if(!soundOn)return;var ctx=audio();if(!ctx)return;var t=ctx.currentTime,o=ctx.createOscillator(),a=ctx.createGain();o.frequency.value=n;a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(a);a.connect(ctx.destination);o.start(t);o.stop(t+0.3);}function rand(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}function build(){if(typeof questionForDay!=="function"||typeof BANK==="undefined")return;var stamp=dayStamp();var r=rand(Number(String(stamp).replace(/-/g,""))||1);var today=questionForDay(stamp);var seen={};seen[today.book+"|"+today.prompt]=1;queue=[today];var bag=BANK.slice();for(var n=bag.length-1;n>0;n--){var j=Math.floor(r()*(n+1));var tmp=bag[n];bag[n]=bag[j];bag[j]=tmp;}for(var i=0;i<bag.length&&queue.length<8;i++){var q=bag[i];var id=q.book+"|"+q.prompt;if(!seen[id]){seen[id]=1;queue.push(q);}}}function paint(){var q=queue[qi];if(!q)return;locked=false;document.getElementById("invitePrompt").textContent=q.prompt;document.getElementById("inviteWhy").textContent=q.book+" \u00b7 "+(qi+1)+" of 8";document.getElementById("inviteNow").textContent="Score "+score;document.getElementById("inviteBest").textContent="Best "+best;var c=document.getElementById("inviteClock");left=30;c.textContent="0:30";clearInterval(clock);clock=setInterval(function(){left--;c.textContent="0:"+(left<10?"0"+left:left);if(left<=0){clearInterval(clock);locked=true;var page=document.getElementById("invitePage");if(page)page.textContent="Time. "+q.ref+". "+q.plain;}},1000);var r=rand((qi+3)*131);opts=q.choices.map(function(t,n){return {t:t,ok:n===0};});for(var n=opts.length-1;n>0;n--){var j=Math.floor(r()*(n+1));var tmp=opts[n];opts[n]=opts[j];opts[j]=tmp;}var box=document.getElementById("inviteChoices");box.innerHTML="";opts.forEach(function(o,i){var b=document.createElement("button");b.className="choice";b.type="button";b.textContent=(i+1)+"  "+o.t;b.onclick=function(){if(locked)return;locked=true;clearInterval(clock);audio();if(o.ok){score+=100+left;chime(392,0.07);}else chime(196,0.05);document.getElementById("invitePage").textContent=(o.ok?"Placed. ":"Not that one. ")+q.ref+". "+q.plain;var next=document.getElementById("inviteNext");next.classList.remove("hidden");next.onclick=function(){if(qi<queue.length-1){qi++;paint();}else document.getElementById("invitePrompt").textContent=score+" on this walk.";};};box.appendChild(b);});}function park(){var on=document.querySelector(".dock button.on");var tab=on&&on.getAttribute("data-tab");var card=document.getElementById("inviteCard");var walks=document.getElementById("walks");if(tab&&tab!=="play"){if(card)card.style.display="none";if(walks)walks.style.display="none";if(tab==="progress"){var wrap=document.querySelector(".wrap");var know=document.getElementById("know")||document.getElementById("tallyPanel");if(!know){var panels=document.querySelectorAll(".panel");for(var i=0;i<panels.length;i++){if(panels[i].textContent.indexOf("How well you know the book")>=0){panels[i].id="know";know=panels[i];}}}if(wrap&&know){wrap.insertBefore(know, wrap.firstChild);know.style.display="block";}}window.scrollTo(0,0);}else if(card)card.style.display="";}setInterval(park,300);build();paint();var quit=document.getElementById("inviteQuit");if(quit)quit.onclick=function(){qi=0;score=0;build();paint();window.scrollTo(0,0);};var snd=document.getElementById("inviteSound");if(snd)snd.onclick=function(){soundOn=!soundOn;snd.textContent=soundOn?"Sound on":"Sound off";};})();<\/script>';
  function openGame(html){html=html.replace(/<audio\b[^>]*>[\s\S]*?<\/audio>/gi,"");html=html.replace("const BANK","var BANK");html=html.replace("let save","var save");html=html.replace('<div class="panel" id="startPanel">', card+'<div class="panel" id="startPanel">');if(html.indexOf("</head>")!==-1)html=html.replace("</head>", look+"</head>");html=html.replace("</body>", hook+"</body>");document.open();document.write(html);document.close();}
