<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bible, Plainly — The Road</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<style>body{margin:0;background:#14110e;color:#f3eadc;font-family:Georgia,serif}p{padding:28px 22px;font-size:18px}</style>
</head>
<body>
<p id="wait">Opening the page…</p>
<script>
(function(){
  var sources=[
    "https://cdn.jsdelivr.net/gh/Jdav0468/bible-plainly-road@208312696c8b4b4702fc9c000791aaf74927f83d/index.html",
    "https://raw.githubusercontent.com/Jdav0468/bible-plainly-road/208312696c8b4b4702fc9c000791aaf74927f83d/index.html"
  ];
  var look = '<style id="look">'
    + 'body{background:radial-gradient(880px 380px at 50% -10%, rgba(212,175,110,.16), transparent 58%), linear-gradient(180deg,#241c16 0%, #0d0b0a 72%) !important;color:#f6f1e8 !important;}'
    + '.wrap{max-width:560px !important;}'
    + 'h1,.panel h2,.book h2,.walk b{font-family:Palatino,"Palatino Linotype",Georgia,serif !important;letter-spacing:-.02em;}'
    + 'h1{border-bottom:1px solid rgba(212,175,110,.4);padding-bottom:10px;}'
    + '.kicker{letter-spacing:.36em !important;color:#d4af6e !important;font-size:11px !important;}'
    + '.lede,.about{color:#e7dcc8 !important;}'
    + '.panel,.walk,.book,.slip,.choice{background:linear-gradient(180deg,#faf6ef,#efe3d0) !important;color:#1c1712 !important;border:1px solid rgba(168,132,74,.5) !important;border-radius:18px !important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), 0 14px 34px rgba(0,0,0,.28) !important;}'
    + '.go,#begin{background:#1b1612 !important;color:#f6f1e8 !important;border-radius:999px !important;letter-spacing:.08em;text-transform:uppercase;}'
    + '.ghost{border-radius:999px !important;border-color:#cbb89a !important;}'
    + '.hero,.scene{border-radius:22px !important;border:1px solid rgba(212,175,110,.45) !important;overflow:hidden;}'
    + '.dock{background:rgba(16,13,11,.94) !important;border-top:1px solid rgba(212,175,110,.42) !important;backdrop-filter:blur(14px);}'
    + '.dock button{letter-spacing:.04em;text-transform:uppercase;font-size:12px !important;}'
    + '.dock button.on{background:#f4efe6 !important;color:#1b1612 !important;border-radius:12px !important;}'
    + '.sound{border-color:rgba(212,175,110,.55) !important;color:#d4af6e !important;}'
    + '.spines button{border-radius:3px 10px 10px 3px !important;}'
    + '</style>';
  var quiet = '<script>(function(){'
    + 'function stopMusic(){if(window._musicTimer){clearInterval(window._musicTimer);window._musicTimer=null;}if(window._studyMaster){try{window._studyMaster.disconnect();}catch(e){}window._studyMaster=null;}var nodes=document.querySelectorAll("audio");for(var i=0;i<nodes.length;i++){try{nodes[i].pause();nodes[i].muted=true;nodes[i].volume=0;nodes[i].removeAttribute("src");}catch(e){}}}'
    + 'function startMusic(){var home=document.getElementById("home");if(window._soundOff||window._musicTimer)return;if(home&&home.classList.contains("hidden"))return;var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;var ctx=window._studyCtx||new Ctx();window._studyCtx=ctx;if(ctx.state==="suspended")ctx.resume();var filter=ctx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=320;var master=ctx.createGain();master.gain.setValueAtTime(0.0001,ctx.currentTime);master.gain.linearRampToValueAtTime(0.0018,ctx.currentTime+6);filter.connect(master);master.connect(ctx.destination);window._studyMaster=master;var line=[146.83,0,0,196,0,0,164.81,0,0,0,220,0,0,0,146.83,0,0,0,0];var step=0;function play(){var home=document.getElementById("home");if(window._soundOff||!home||home.classList.contains("hidden")){stopMusic();return;}var f=line[step%line.length];step+=1;if(!f)return;var now=ctx.currentTime;var o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(f,now);g.gain.setValueAtTime(0.0001,now);g.gain.linearRampToValueAtTime(0.04,now+0.8);g.gain.linearRampToValueAtTime(0.0001,now+3.2);o.connect(g);g.connect(filter);o.start(now);o.stop(now+3.3);}play();window._musicTimer=setInterval(play,5200);}'
    + 'window.startMusic=startMusic;window.stopMusic=stopMusic;stopMusic();'
    + 'var sound=document.getElementById("sound");if(sound){sound.addEventListener("click",function(){window._soundOff=sound.textContent.toLowerCase().indexOf("off")!==-1;if(window._soundOff)stopMusic();else startMusic();});}'
    + 'document.body.addEventListener("pointerdown",function(){if(!window._soundOff)startMusic();});'
    + '})();<\/script>';
  function openGame(html){
    html = html.replace(/<audio\b[\s\S]*?<\/audio>/gi, '<audio id="hymn" preload="none"></audio>');
    html = html.replace(/hymn\.play\s*\(/g, '(function(){})(');
    html = html.replace(/\.volume\s*=\s*0\.\d+/g, '.volume=0');
    html = html.replace('</body>', look + quiet + '</body>');
    document.open();
    document.write(html);
    document.close();
  }
  function fail(){ var el=document.getElementById('wait'); if(el) el.textContent='The page did not open. Refresh once.'; }
  function tryAt(i){
    if(i>=sources.length){ fail(); return; }
    fetch(sources[i], {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('bad'); return r.text(); }).then(function(html){
      if(html.indexOf('Sixty-six books')===-1 && html.indexOf('BANK')===-1) throw new Error('short');
      openGame(html);
    }).catch(function(){ tryAt(i+1); });
  }
  tryAt(0);
})();
</script>
</body>
</html>
